name: Hindi Auto-Blogger

on:
  schedule:
    # Runs every hour — 24 articles/day
    - cron: "0 * * * *"

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      category:
        description: "Category to post (empty = auto round-robin)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "science"
          - "technology"
          - "automobile"

jobs:
  post-article:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run content cycle
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          PLATFORM:             ${{ secrets.PLATFORM }}
          # WordPress
          WP_URL:               ${{ secrets.WP_URL }}
          WP_USERNAME:          ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:      ${{ secrets.WP_APP_PASSWORD }}
          # Blogger (only needed if PLATFORM=blogger)
          BLOG_ID:              ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          AUTO_PUBLISH:         "true"
          GITHUB_RUN_NUMBER:    ${{ github.run_number }}
          CATEGORY:             ${{ github.event.inputs.category }}
        run: python run_once.py

      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_number }}
          path: agent.log
          retention-days: 14
